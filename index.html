<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>n00bSec TV — Live Now</title>
<meta name="description" content="Watch every cybersecurity streamer that's Live-Now, all at once. The Twitch and YouTube streams auto-update every minute.">
<!-- Link preview (Open Graph / Twitter Card) — what Discord, Slack, iMessage etc. show when the URL is posted. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="n00bSec TV">
<meta property="og:title" content="n00bSec TV — Live Now">
<meta property="og:description" content="Watch every cybersecurity streamer that's Live-Now, all at once. The Twitch and YouTube streams auto-update every minute.">
<meta property="og:url" content="https://n00bsec.live/">
<meta property="og:image" content="https://n00bsec.live/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="n00bSec frog hacker in a hoodie at a laptop">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="n00bSec TV — Live Now">
<meta name="twitter:description" content="Watch every cybersecurity streamer that's Live-Now, all at once. The Twitch and YouTube streams auto-update every minute.">
<meta name="twitter:image" content="https://n00bsec.live/og-image.png">
<meta name="theme-color" content="#9147ff">
<link rel="icon" type="image/png" sizes="256x256" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0f14;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid #23262e;
    background: #11141b;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 { font-size: 19px; margin: 0; white-space: nowrap; }
  #updatedNote { color: #9aa0ab; font-size: 13px; white-space: nowrap; }
  #viewerNote { color: #ff6b6b; font-size: 13px; font-weight: 600; white-space: nowrap; display: none; }
  #presenceNote { color: #4fc3f7; font-size: 13px; font-weight: 600; white-space: nowrap; display: none; }
  .playerHeader .pviews { color: #ff6b6b; font-weight: 600; white-space: nowrap; margin-left: auto; }
  #errorNote { color: #ffb454; font-size: 12px; display: none; }
  #headerActions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #multitwitchBtn {
    background: #9147ff;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  #multitwitchBtn:hover { background: #7c3aed; }
  #recentBtn {
    background: #161920;
    color: #e6e6e6;
    border: 1px solid #2b2f3a;
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  #recentBtn:hover { background: #1d2129; border-color: #a970ff; }

  #layout { display: flex; align-items: flex-start; }
  #content { flex: 1; min-width: 0; }
  #sidebar {
    width: 300px;
    flex-shrink: 0;
    padding: 12px;
    border-right: 1px solid #23262e;
    height: calc(100vh - 57px);
    overflow-y: auto;
    position: sticky;
    top: 57px;
  }
  .streamItem {
    background: #161920;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
  .streamItem .row { display: flex; align-items: flex-start; gap: 8px; }
  .streamItem input[type="checkbox"] { margin-top: 4px; cursor: pointer; flex-shrink: 0; }
  .streamItem .info { min-width: 0; flex: 1; }
  .streamItem a.name {
    color: #e6e6e6;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .streamItem a.name:hover { text-decoration: underline; color: #a970ff; }
  .streamItem .title {
    color: #9aa0ab;
    font-size: 12px;
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }

  #grid {
    padding: 16px;
    display: grid;
    gap: 16px;
    align-content: start;
  }
  #grid.hasLive { min-height: calc(100vh - 57px); }

  /* Recent uploads: click-to-play panes under the live players. */
  #recentSection { padding: 0 16px 24px; scroll-margin-top: 70px; display: none; }
  #recentSection h2 {
    font-size: 13px;
    color: #9aa0ab;
    margin: 8px 4px 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  #recentGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .vidCard { background: #161920; border-radius: 8px; overflow: hidden; scroll-margin-top: 70px; }
  .vidCard.playing { box-shadow: 0 0 0 2px #a970ff; }
  .vidHeader { padding: 8px 10px; font-size: 13px; }
  .vidHeader .vt {
    font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .vidHeader .vm { color: #9aa0ab; font-size: 11px; margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .vidHeader .vm .vch { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .vidHeader .vm a { color: #a970ff; text-decoration: none; margin-left: auto; white-space: nowrap; }
  .vidHeader .vm a:hover { text-decoration: underline; }
  .vidPoster { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; cursor: pointer; }
  .vidPoster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .vidPoster .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .vidPoster .play span {
    width: 64px;
    height: 44px;
    border-radius: 10px;
    background: rgba(0, 0, 0, .72);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 20px;
    padding-left: 4px;
    transition: background .15s;
  }
  .vidPoster:hover .play span { background: #ff0000; }
  .playerCard { background: #161920; border-radius: 8px; overflow: hidden; }
  .playerHeader {
    padding: 8px 10px;
    font-size: 13px;
    display: flex;
    gap: 10px;
    justify-content: space-between;
  }
  .playerHeader .pname { font-weight: 600; white-space: nowrap; }
  .playerHeader .ptitle {
    color: #9aa0ab;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .playerFrame { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; }
  .playerFrame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .linkCard {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 50px 12px;
    color: #9aa0ab;
    background: #000;
  }
  .linkCard a { color: #a970ff; text-decoration: none; font-weight: 600; }
  .linkCard a:hover { text-decoration: underline; }

  .emptyState {
    grid-column: 1 / -1;
    color: #9aa0ab;
    padding: 80px 20px;
    text-align: center;
    font-size: 15px;
  }
  .sidebarEmpty { color: #9aa0ab; font-size: 13px; padding: 12px 4px; }
  #promo { margin-top: 16px; }
  #promo img { display: block; width: 100%; border-radius: 8px; }
  #recentVideos { margin-top: 16px; }
  #recentVideos h3 { font-size: 13px; color: #9aa0ab; margin: 0 4px 8px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .recentItem {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: #161920;
    border-radius: 8px;
    padding: 8px;
    margin-bottom: 8px;
    text-decoration: none;
    color: #e6e6e6;
  }
  .recentItem:hover { background: #1d2129; }
  .recentItem img { width: 96px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; background: #000; flex-shrink: 0; }
  .recentItem .rinfo { min-width: 0; flex: 1; }
  .recentItem .rtitle {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .recentItem .rmeta { font-size: 11px; color: #9aa0ab; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 800px) {
    #layout { flex-direction: column; }
    #sidebar {
      width: 100%;
      height: auto;
      max-height: 220px;
      border-right: none;
      border-bottom: 1px solid #23262e;
      position: static;
    }
    #grid.hasLive { min-height: auto; }
    #recentGrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>🔴 n00bSec TV — Live Now (<span id="liveCount">0</span>)</h1>
  <div id="updatedNote">updated —</div>
  <div id="viewerNote"></div>
  <div id="presenceNote" title="People with this page open right now"></div>
  <div id="errorNote">⚠ last check failed</div>
  <div id="headerActions">
    <button id="recentBtn" type="button">▶️ Recent uploads</button>
    <button id="multitwitchBtn" type="button">📺 Watch all on Multitwitch</button>
  </div>
</header>
<div id="layout">
  <aside id="sidebar">
    <div id="streamList"></div>
    <!-- Sidebar artwork: swap by replacing promo.jpg in the repo (keep the filename). Links to the SeaCon3 page. -->
    <div id="promo"><a href="seacon3.html"><img src="promo.jpg" alt="SeaCon3 Persistence — click for details" loading="lazy"></a></div>
    <!-- Newest YouTube uploads across all tracked channels (from live.json "videos"). Click = play in the pane below the live players. -->
    <div id="recentVideos"></div>
  </aside>
  <div id="content">
    <main id="grid"></main>
    <!-- Click-to-play panes for the same uploads; rebuilt incrementally so a playing video survives the poll. -->
    <section id="recentSection">
      <h2 id="recentHeading">Recent YouTube uploads</h2>
      <div id="recentGrid"></div>
    </section>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
(function () {
  'use strict';

  var POLL_MS = 60000;
  var PREFS_KEY = 'n00bsecLivePrefs';
  var DEFAULT_SHOWN = 4;

  var prefs = {};
  try {
    prefs = JSON.parse(localStorage.getItem(PREFS_KEY) || '{}');
  } catch (e) {
    prefs = {};
  }

  var lastData = null;
  var playerEls = new Map();

  var els = {
    liveCount: document.getElementById('liveCount'),
    updatedNote: document.getElementById('updatedNote'),
    viewerNote: document.getElementById('viewerNote'),
    multitwitchBtn: document.getElementById('multitwitchBtn'),
    errorNote: document.getElementById('errorNote'),
    streamList: document.getElementById('streamList'),
    recentVideos: document.getElementById('recentVideos'),
    grid: document.getElementById('grid'),
    recentSection: document.getElementById('recentSection'),
    recentGrid: document.getElementById('recentGrid'),
    recentHeading: document.getElementById('recentHeading'),
    recentBtn: document.getElementById('recentBtn')
  };
  var RECENT_MAX = 20;
  var lastRecentKey = null;
  var videoEls = new Map();   // video_id -> { card, poster, playing }

  els.recentBtn.addEventListener('click', function () {
    els.recentSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function savePrefs() {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    } catch (e) {
      /* localStorage unavailable (private mode, etc) — degrade silently */
    }
  }

  function extractYouTubeId(link) {
    try {
      var u = new URL(link, location.href);
      if (u.hostname.indexOf('youtu.be') !== -1) {
        var short = u.pathname.replace(/^\//, '');
        return short || null;
      }
      var v = u.searchParams.get('v');
      if (v) return v;
      var liveMatch = u.pathname.match(/\/live\/([^/?]+)/);
      if (liveMatch) return liveMatch[1];
      var embedMatch = u.pathname.match(/\/embed\/([^/?]+)/);
      if (embedMatch) return embedMatch[1];
      return null;
    } catch (e) {
      return null;
    }
  }

  function computeShown(streams) {
    var decisions = {};
    var count = 0;
    for (var i = 0; i < streams.length; i++) {
      var s = streams[i];
      var show;
      if (Object.prototype.hasOwnProperty.call(prefs, s.name)) {
        show = !!prefs[s.name];
      } else {
        show = count < DEFAULT_SHOWN;
      }
      decisions[s.name] = show;
      if (show) count++;
    }
    return decisions;
  }

  function timeAgo(iso) {
    var then = new Date(iso).getTime();
    if (isNaN(then)) return 'unknown';
    var diffMs = Date.now() - then;
    var mins = Math.floor(diffMs / 60000);
    if (mins <= 0) return 'just now';
    if (mins === 1) return '1 min ago';
    if (mins < 60) return mins + ' min ago';
    var hrs = Math.floor(mins / 60);
    if (hrs === 1) return '1 hr ago';
    return hrs + ' hr ago';
  }

  function viewersLabel(s) {
    return typeof s.viewers === 'number' ? '👁 ' + s.viewers.toLocaleString() : '';
  }

  function renderHeader() {
    if (!lastData) return;
    els.liveCount.textContent = lastData.streams.length;
    els.updatedNote.textContent = 'updated ' + timeAgo(lastData.updated);

    var total = 0, known = false;
    for (var v = 0; v < lastData.streams.length; v++) {
      var n = lastData.streams[v].viewers;
      if (typeof n === 'number') { total += n; known = true; }
    }
    if (known) {
      els.viewerNote.textContent = '👁 ' + total.toLocaleString() + ' watching';
      els.viewerNote.style.display = 'block';
    } else {
      els.viewerNote.style.display = 'none';
    }

    var twitchNames = [];
    for (var i = 0; i < lastData.streams.length; i++) {
      if (lastData.streams[i].platform === 'twitch') twitchNames.push(lastData.streams[i].name);
    }
    if (twitchNames.length >= 2) {
      els.multitwitchBtn.style.display = 'inline-block';
      els.multitwitchBtn.onclick = function () {
        window.open('https://www.multitwitch.tv/' + twitchNames.join('/'), '_blank');
      };
    } else {
      els.multitwitchBtn.style.display = 'none';
    }

    var vidCount = Math.min((lastData.videos || []).length, RECENT_MAX);
    if (vidCount > 0) {
      els.recentBtn.textContent = '▶️ Recent uploads (' + vidCount + ')';
      els.recentBtn.style.display = 'inline-block';
    } else {
      els.recentBtn.style.display = 'none';
    }
  }

  function renderSidebar(streams, decisions) {
    els.streamList.innerHTML = '';
    if (!streams.length) {
      var empty = document.createElement('div');
      empty.className = 'sidebarEmpty';
      empty.textContent = 'Nobody is live right now.';
      els.streamList.appendChild(empty);
      return;
    }
    for (var i = 0; i < streams.length; i++) {
      (function (s) {
        var item = document.createElement('div');
        item.className = 'streamItem';

        var row = document.createElement('div');
        row.className = 'row';

        var checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = !!decisions[s.name];
        checkbox.addEventListener('change', function () {
          prefs[s.name] = checkbox.checked;
          savePrefs();
          renderAll();
        });

        var info = document.createElement('div');
        info.className = 'info';

        var icon = s.platform === 'twitch' ? '🟣' : '▶️';
        var nameLink = document.createElement('a');
        nameLink.className = 'name';
        nameLink.href = s.link;
        nameLink.target = '_blank';
        nameLink.rel = 'noopener noreferrer';
        nameLink.textContent = icon + ' ' + s.name;

        var titleDiv = document.createElement('div');
        titleDiv.className = 'title';
        var vl = viewersLabel(s);
        titleDiv.textContent = (vl ? vl + ' · ' : '') + (s.title || '');

        info.appendChild(nameLink);
        info.appendChild(titleDiv);

        row.appendChild(checkbox);
        row.appendChild(info);
        item.appendChild(row);
        els.streamList.appendChild(item);
      })(streams[i]);
    }
  }

  function makeTwitchIframe(name) {
    var parent = location.hostname || 's0ldier93.github.io';
    var iframe = document.createElement('iframe');
    iframe.src = 'https://player.twitch.tv/?channel=' + encodeURIComponent(name) + '&parent=' + parent + '&muted=true&autoplay=true';
    iframe.allowFullscreen = true;
    iframe.setAttribute('allow', 'autoplay; fullscreen');
    return iframe;
  }

  function makeYouTubeIframe(id, muted) {
    if (muted === undefined) muted = true;
    var iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1' + (muted ? '&mute=1' : '');
    iframe.allowFullscreen = true;
    iframe.setAttribute('allow', 'autoplay; fullscreen');
    return iframe;
  }

  function buildCard(s) {
    var card = document.createElement('div');
    card.className = 'playerCard';

    var header = document.createElement('div');
    header.className = 'playerHeader';
    var pname = document.createElement('span');
    pname.className = 'pname';
    pname.textContent = (s.platform === 'twitch' ? '🟣 ' : '▶️ ') + s.name;
    var ptitle = document.createElement('span');
    ptitle.className = 'ptitle';
    ptitle.textContent = s.title || '';
    var pviews = document.createElement('span');
    pviews.className = 'pviews';
    pviews.textContent = viewersLabel(s);
    header.appendChild(pname);
    header.appendChild(ptitle);
    header.appendChild(pviews);
    card.appendChild(header);

    var frameWrap;
    if (s.platform === 'twitch') {
      frameWrap = document.createElement('div');
      frameWrap.className = 'playerFrame';
      frameWrap.appendChild(makeTwitchIframe(s.name));
    } else {
      var id = extractYouTubeId(s.link);
      if (id) {
        frameWrap = document.createElement('div');
        frameWrap.className = 'playerFrame';
        frameWrap.appendChild(makeYouTubeIframe(id));
      } else {
        frameWrap = document.createElement('div');
        frameWrap.className = 'linkCard';
        var a = document.createElement('a');
        a.href = s.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'Open stream ↗';
        frameWrap.appendChild(a);
      }
    }
    card.appendChild(frameWrap);
    return { card: card, ptitle: ptitle, pviews: pviews };
  }

  function renderGrid(streams, decisions) {
    var shownStreams = [];
    for (var i = 0; i < streams.length; i++) {
      if (decisions[streams[i].name]) shownStreams.push(streams[i]);
    }
    var shownNames = {};
    for (var j = 0; j < shownStreams.length; j++) shownNames[shownStreams[j].name] = true;

    playerEls.forEach(function (entry, name) {
      if (!shownNames[name]) {
        entry.card.remove();
        playerEls.delete(name);
      }
    });

    for (var k = 0; k < shownStreams.length; k++) {
      var s = shownStreams[k];
      var entry = playerEls.get(s.name);
      if (!entry) {
        entry = buildCard(s);
        playerEls.set(s.name, entry);
        els.grid.appendChild(entry.card);
      } else {
        entry.ptitle.textContent = s.title || '';
        entry.pviews.textContent = viewersLabel(s);
      }
    }

    var count = shownStreams.length;
    var cols = 1;
    if (count > 4) cols = 3;
    else if (count > 1) cols = 2;
    els.grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    els.grid.classList.toggle('hasLive', streams.length > 0);

    var emptyEl = els.grid.querySelector('.emptyState');
    if (emptyEl) emptyEl.remove();
    if (!streams.length) {
      els.grid.appendChild(buildEmptyState((lastData && lastData.videos) || []));
    }
  }

  function buildEmptyState(videos) {
    var wrap = document.createElement('div');
    wrap.className = 'emptyState';
    var msg = document.createElement('div');
    msg.textContent = 'Nobody is live right now. This page checks back every minute.'
      + (videos.length ? ' Catch up on the latest uploads below.' : '');
    wrap.appendChild(msg);
    return wrap;
  }

  /* ---- Recent uploads: click-to-play panes ----
     Thumbnail + play button until clicked, then the YouTube player is loaded in place.
     The grid is updated incrementally (cards keyed by video_id) so a video that is
     playing is not torn down when the poll brings a new upload. */
  function videoThumb(v, quality) {
    return v.thumbnail
      ? v.thumbnail.replace(/\/(hq|mq|sd|maxres)default\.jpg$/, '/' + quality + 'default.jpg')
      : 'https://i.ytimg.com/vi/' + encodeURIComponent(v.video_id) + '/' + quality + 'default.jpg';
  }

  function makeVideoCard(v) {
    var card = document.createElement('div');
    card.className = 'vidCard';
    card.id = 'vid-' + v.video_id;

    var header = document.createElement('div');
    header.className = 'vidHeader';
    var vt = document.createElement('div');
    vt.className = 'vt';
    vt.textContent = v.title || 'New video';
    vt.title = v.title || '';
    var vm = document.createElement('div');
    vm.className = 'vm';
    var vch = document.createElement('span');
    vch.className = 'vch';
    vch.textContent = '▶️ ' + (v.channel || '') + (v.published_at ? ' · ' + timeAgo(v.published_at) : '');
    var ext = document.createElement('a');
    ext.href = v.link;
    ext.target = '_blank';
    ext.rel = 'noopener noreferrer';
    ext.textContent = 'YouTube ↗';
    vm.appendChild(vch);
    vm.appendChild(ext);
    header.appendChild(vt);
    header.appendChild(vm);
    card.appendChild(header);

    var poster = document.createElement('div');
    poster.className = 'vidPoster';
    var img = document.createElement('img');
    img.src = videoThumb(v, 'hq');
    img.alt = '';
    img.loading = 'lazy';
    var play = document.createElement('div');
    play.className = 'play';
    var btn = document.createElement('span');
    btn.textContent = '▶';
    play.appendChild(btn);
    poster.appendChild(img);
    poster.appendChild(play);
    poster.addEventListener('click', function () { playVideo(v.video_id, false); });
    card.appendChild(poster);

    return { card: card, poster: poster, meta: vch, video: v, playing: false };
  }

  function playVideo(id, scroll) {
    var entry = videoEls.get(id);
    if (!entry) return;
    if (scroll) entry.card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (entry.playing) return;
    // Only one player at a time: reset any other card back to its poster.
    videoEls.forEach(function (other, otherId) {
      if (otherId !== id && other.playing) resetVideo(other);
    });
    var frame = document.createElement('div');
    frame.className = 'playerFrame';
    frame.appendChild(makeYouTubeIframe(id, false));
    entry.card.replaceChild(frame, entry.poster);
    entry.frame = frame;
    entry.playing = true;
    entry.card.classList.add('playing');
  }

  function resetVideo(entry) {
    if (!entry.playing) return;
    entry.card.replaceChild(entry.poster, entry.frame);
    entry.frame = null;
    entry.playing = false;
    entry.card.classList.remove('playing');
  }

  function renderRecentGrid(videos) {
    videos = (videos || []).slice(0, RECENT_MAX);
    if (!videos.length) {
      els.recentSection.style.display = 'none';
      return;
    }
    els.recentSection.style.display = 'block';
    els.recentHeading.textContent = 'Recent YouTube uploads (' + videos.length + ')';

    var keep = {};
    for (var i = 0; i < videos.length; i++) keep[videos[i].video_id] = true;
    videoEls.forEach(function (entry, id) {
      if (!keep[id]) {
        entry.card.remove();
        videoEls.delete(id);
      }
    });

    // Walk the desired order; insert new cards without moving existing ones.
    var cursor = els.recentGrid.firstChild;
    for (var k = 0; k < videos.length; k++) {
      var v = videos[k];
      var entry = videoEls.get(v.video_id);
      if (!entry) {
        entry = makeVideoCard(v);
        videoEls.set(v.video_id, entry);
        els.recentGrid.insertBefore(entry.card, cursor);
      } else {
        entry.meta.textContent = '▶️ ' + (v.channel || '') + (v.published_at ? ' · ' + timeAgo(v.published_at) : '');
        if (entry.card === cursor) {
          cursor = cursor.nextSibling;
        } else {
          els.recentGrid.insertBefore(entry.card, cursor);
        }
      }
    }
  }

  function renderRecent(videos) {
    videos = (videos || []).slice(0, RECENT_MAX);
    // Only rebuild when the set changes, so the thumbnails don't flicker on every poll.
    var key = videos.map(function (v) { return v.video_id; }).join('|');
    if (key === lastRecentKey) return;
    lastRecentKey = key;

    els.recentVideos.innerHTML = '';
    if (!videos.length) return;

    var heading = document.createElement('h3');
    heading.textContent = 'Recent YouTube uploads';
    els.recentVideos.appendChild(heading);

    for (var i = 0; i < videos.length; i++) {
      (function (v) {
        var a = document.createElement('a');
        a.className = 'recentItem';
        a.href = v.link;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.title = (v.title || '') + ' — click to play here';
        // Plain click plays in the pane on this page; ctrl/middle-click still opens YouTube.
        a.addEventListener('click', function (ev) {
          if (ev.button !== 0 || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
          if (!videoEls.has(v.video_id)) return;
          ev.preventDefault();
          playVideo(v.video_id, true);
        });

        var img = document.createElement('img');
        img.src = videoThumb(v, 'mq');
        img.alt = '';
        img.loading = 'lazy';
        a.appendChild(img);

        var info = document.createElement('div');
        info.className = 'rinfo';
        var t = document.createElement('div');
        t.className = 'rtitle';
        t.textContent = v.title || 'New video';
        var m = document.createElement('div');
        m.className = 'rmeta';
        m.textContent = (v.channel || '') + (v.published_at ? ' · ' + timeAgo(v.published_at) : '');
        info.appendChild(t);
        info.appendChild(m);
        a.appendChild(info);

        els.recentVideos.appendChild(a);
      })(videos[i]);
    }
  }

  function renderAll() {
    if (!lastData) return;
    var decisions = computeShown(lastData.streams);
    renderHeader();
    renderSidebar(lastData.streams, decisions);
    renderGrid(lastData.streams, decisions);
    renderRecentGrid(lastData.videos);
    renderRecent(lastData.videos);
  }

  function poll() {
    fetch('live.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (resp) {
        if (!resp.ok) throw new Error('bad status ' + resp.status);
        return resp.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.streams)) throw new Error('bad schema');
        lastData = data;
        els.errorNote.style.display = 'none';
        renderAll();
      })
      .catch(function () {
        els.errorNote.style.display = 'block';
        if (lastData) renderHeader();
      });
  }

  poll();
  setInterval(poll, POLL_MS);

  /* ---- "people here" presence counter (Firebase Realtime Database) ----
     Each open tab registers one child under /presence with a heartbeat timestamp
     and an onDisconnect cleanup; the header shows how many children are fresh.
     Disabled when firebase-config.js leaves window.N00BSEC_FIREBASE null. */
  function startPresence() {
    var cfg = window.N00BSEC_FIREBASE;
    if (!cfg || typeof firebase === 'undefined') return;
    var STALE_MS = 5 * 60 * 1000;
    var HEARTBEAT_MS = 2 * 60 * 1000;
    var note = document.getElementById('presenceNote');
    try {
      firebase.initializeApp(cfg);
      var db = firebase.database();
      var list = db.ref('presence');
      var me = list.push();
      var offsetRef = db.ref('.info/serverTimeOffset');
      var serverOffset = 0;
      offsetRef.on('value', function (s) { serverOffset = s.val() || 0; });

      function beat() { me.set({ t: firebase.database.ServerValue.TIMESTAMP }); }
      me.onDisconnect().remove();
      beat();
      setInterval(beat, HEARTBEAT_MS);

      list.on('value', function (snap) {
        var now = Date.now() + serverOffset;
        var count = 0;
        snap.forEach(function (child) {
          var v = child.val();
          if (v && typeof v.t === 'number' && now - v.t < STALE_MS) count++;
        });
        if (count > 0) {
          note.textContent = '👥 ' + count.toLocaleString() + (count === 1 ? ' person here' : ' people here');
          note.style.display = 'block';
        } else {
          note.style.display = 'none';
        }
      }, function () { note.style.display = 'none'; });
    } catch (e) {
      note.style.display = 'none';
    }
  }
  startPresence();
})();
</script>
</body>
</html>
